<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0a08"/>
      <stop offset="1" stop-color="#1c1410"/>
    </linearGradient>
    <filter id="grain" color-interpolation-filters="sRGB" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 0 0.12  0 0 0 0.12 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="glow" color-interpolation-filters="sRGB" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" color-interpolation-filters="sRGB" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <!-- Crescent: an inner circle set higher than the outer one cuts the ring open at the top. -->
    <mask id="crescent" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <circle cx="670" cy="429" r="156" fill="#fff"/>
      <circle cx="670" cy="394" r="131" fill="#000"/>
    </mask>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <!-- Shadow from a flat shape: a gradient run through the filter renders in bands. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#000" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#panel)"/>
  <g clip-path="url(#body)">
    <rect x="100" y="100" width="824" height="824" fill="#000" filter="url(#grain)"/>
    <!-- prompt: ">" then a q drawn as a crescent pierced by a spike -->
    <g filter="url(#glow)" fill="#ff9a2e">
      <path d="M222 222 L470 347 L222 472 L222 444 L414 347 L222 250 Z"/>
      <g transform="translate(670 273) scale(0.718) translate(-670 -429)">
      <rect x="500" y="250" width="340" height="340" mask="url(#crescent)"/>
      <path d="M652 465 L688 465 L688 680 L670 745 L652 680 Z"/>
      <rect x="621" y="465" width="98" height="26"/>
      </g>
    </g>
    <!-- output lines under the prompt -->
    <rect x="232" y="531" width="560" height="12" fill="#ff9a2e" opacity="0.35"/>
    <rect x="232" y="556" width="352" height="12" fill="#ff9a2e" opacity="0.2"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#000" stroke-opacity="0.5" stroke-width="4"/>
</svg>
